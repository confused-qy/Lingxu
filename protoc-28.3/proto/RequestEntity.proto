syntax = "proto3";

// 生成的 C# 类会放进这个命名空间。
// Unity 脚本里写 using Protocol; 就能用到下面这些类。
option csharp_namespace = "Protocol";

// 客户端发给服务器的请求
// 注意：= 后面的数字是「字段编号」，不是默认值。编号一旦用过就不要改、不要复用。
message BasePackage {
  int32 proto_code = 1; // 协议编号
  int32 unity_session_id = 2; // 会话ID

  bytes data = 10; // 请求数据
}

message RegistReq {
  string user_name = 1; // 用户名
  string phone_num = 2;
  string password = 3; // 密码
}

message LoginReq {
  string user_name = 1; // 用户名
  string password = 2; // 密码
}

message GateServerListReq {
  int32 server_id = 1; // 服务器ID
}

// 登录游戏服务器请求
message LoginGameServerReq {
  int32 account_id = 1; // 账号ID
  int32 game_server_id = 2; // 游戏服务器ID
}

// 创建角色请求
message CreateRoleReq {
  int32 account_id = 1; // 账号ID
  int32 game_server_id = 2; // 所属的游戏服务器ID
  string nickname = 3; // 昵称
  int32 job_id = 4; // 职业ID
}